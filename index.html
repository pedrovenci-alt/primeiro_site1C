<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Guardião do Carbono</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2e3440;
            color: #d8dee9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #3b4252;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #8fbcbb; }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background-color: #434c5e;
            padding: 10px;
            border-radius: 8px;
        }
        .stat { font-weight: bold; }
        .info-box {
            background-color: #4c566a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #81a1c1;
            color: #2e3440;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #88c0d0; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>O Guardião do Carbono 🌳🔥</h1>
    
    <div class="stats">
        <div class="stat">💰 Dinheiro: <span id="money">100</span></div>
        <div class="stat">🌱 Sustentabilidade: <span id="sust">50</span>%</div>
        <div class="stat">⚡ Eficiência: <span id="ef">50</span>%</div>
    </div>

    <div class="info-box" id="text">
