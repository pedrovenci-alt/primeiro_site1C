<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioCarbon: O Desafio do Campo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>BioCarbon <i class="fas fa-leaf"></i></h1>
            <div class="stats-bar">
                <div class="stat-item">
                    <i class="fas fa-wallet"></i> 
                    <span>R$ <span id="money">500</span></span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-smog"></i> 
                    <div class="progress-bg"><div id="pollution-bar" class="progress-fill red" style="width: 20%"></div></div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-seedling"></i> 
                    <div class="progress-bg"><div id="sust-bar" class="progress-fill green" style="width: 50%"></div></div>
                </div>
            </div>
        </header>

        <main id="game-screen">
            <div class="event-card">
                <div id="image-placeholder" class="scenario-image">
                    <i class="fas fa-tractor fa-4x"></i>
                </div>
                <h2 id="scenario-title">Bem-vindo, Fazendeiro!</h2>
                <p id="scenario-desc">Você assumiu uma unidade de carbonização. O mercado exige carvão, mas o planeta exige cuidado. Suas decisões moldarão o futuro do campo.</p>
                
                <div id="info-didatica" class="info-box">
                    <i class="fas fa-lightbulb"></i>
                    <span id="fact-text">A carbonização é o processo de transformar biomassa (madeira) em carbono estável através do calor.</span>
                </div>
            </div>

            <div id="options-container" class="actions">
                </div>
        </main>

        <footer>
            <p>Rodada: <span id="round">1</span>/5</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
